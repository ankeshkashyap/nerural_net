<!DOCTYPE html>
<html>
<head>
    <title>NumPy Digit Recognizer</title>

    <style>
        body {
            background-color: black;
            color: lime;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        canvas {
            background: black;
            border: 2px solid #333;
            cursor: crosshair;
            height :280px;
            width:280px;
            
        }

        button {
            margin: 15px 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }

        #imageChoices {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        #imageChoices img {
            width: 60px;
            height: 60px;
            image-rendering: pixelated;
            border: 2px solid #333;
            cursor: pointer;
            background: black;
        }

        #notice {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        #imageChoices img:hover {
            border-color: lime;
        }
    </style>
</head>

<body>

    <h1>Draw a Digit</h1>

    <canvas id="canvas" width="28" height="28"></canvas>

    <br>

    <button id="clear">Clear</button>
    <button id="predict">Predict</button>
    <button id="chooseImage">Choose Image</button>

    <div id="notice">
        Note: Hand-drawn digits may have lower prediction accuracy.
    </div>

    <div id="imageChoices"></div>
    
    <div id="result">
        Prediction: -
        <br>
        Confidence: -
    </div>

    

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let drawing = false;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";


        canvas.addEventListener("mousedown", (event) => {
            drawing = true;

            const rect = canvas.getBoundingClientRect();

             const x = (event.clientX - rect.left) * 28 / rect.width;
             const y = (event.clientY - rect.top) * 28 / rect.height;

            ctx.beginPath();
            ctx.moveTo(x,y);
        });


        canvas.addEventListener("mousemove", (event) => {
            if (!drawing) return;

            const rect = canvas.getBoundingClientRect();

            const x = (event.clientX - rect.left) * 28 / rect.width;
            const y = (event.clientY - rect.top) * 28 / rect.height;

            ctx.lineTo(x,y);
            ctx.stroke();
        });


        canvas.addEventListener("mouseup", () => {
            drawing = false;
        });


        canvas.addEventListener("mouseleave", () => {
            drawing = false;
        });

        const chooseImageButton = document.getElementById("chooseImage");
        const imageChoices = document.getElementById("imageChoices");

        chooseImageButton.addEventListener("click", async () => {

            imageChoices.innerHTML = "";

            const response = await fetch("/random-images");
            const data = await response.json();

            data.images.forEach((imageData) => {

                const img = document.createElement("img");

                img.src = imageData;

                img.addEventListener("click", () => {

                    const selectedImage = new Image();

                    selectedImage.onload = () => {

                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        ctx.drawImage(
                            selectedImage,
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );
                    };

                    selectedImage.src = imageData;
                });

                imageChoices.appendChild(img);
            });
        });

        document.getElementById("clear").addEventListener("click", () => {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "white";
            imageChoices.innerHTML = "";

            document.getElementById("result").innerHTML =
                "Prediction: -<br>Confidence: -";
            
        });


        document.getElementById("predict").addEventListener("click", async () => {

            const image = canvas.toDataURL("image/png");

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    image: image
                })
            });

            const result = await response.json();

            document.getElementById("result").innerHTML =
                "Prediction: " + result.prediction +
                "<br>" +
                "Confidence: " +
                (result.confidence * 100).toFixed(2) + "%";
        });
    </script>

</body>
</html>
